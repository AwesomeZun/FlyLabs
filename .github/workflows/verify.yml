name: Verify FlyLabs
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run qa
  browser-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:demo
      - run: npx playwright install --with-deps chromium
      - name: Verify public prototype locally
        run: |
          python3 -m http.server 4220 --bind 127.0.0.1 --directory dist > /tmp/flylabs-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4220 > /dev/null; then break; fi
            sleep 1
          done
          npm run qa:demo
